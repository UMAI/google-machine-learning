[project]
name = "google-machine-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-ml-edu>=0.1.3",
    "ipykernel>=7.4.0",
    "ipython>=9.17.1",
    "keras>=3.15.1",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "tensorflow[and-cuda]>=2.22.0rc0",
]

[project.scripts]
google-machine-learning = "google_machine_learning:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
